<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Outer decorative star / gold border -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.5" />
  
  <!-- Central Quran Book Motif -->
  <g transform="translate(106, 120)">
    <!-- Book Left Page -->
    <path d="M 150 200 C 100 170, 30 180, 10 190 L 10 60 C 30 50, 100 40, 150 70 Z" fill="#fdfbf7" opacity="0.95" />
    <!-- Book Right Page -->
    <path d="M 150 200 C 200 170, 270 180, 290 190 L 290 60 C 270 50, 200 40, 150 70 Z" fill="#fdfbf7" opacity="0.95" />
    <!-- Book Center Spine -->
    <line x1="150" y1="65" x2="150" y2="205" stroke="#d97706" stroke-width="5" stroke-linecap="round" />
    
    <!-- Arabic Calligraphy "مُتقِن" center mark -->
    <circle cx="150" cy="135" r="34" fill="url(#gold)" />
    <!-- Checkmark inside gold circle -->
    <path d="M 137 135 L 146 144 L 163 126" fill="none" stroke="#064e3b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
